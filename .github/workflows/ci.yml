name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test deps
        run: python -m pip install -e ".[dev]"
      - name: Run unit tests -- no real Safari needed, all subprocess calls mocked
        run: python -m pytest -v
      - name: Smoke-test the CLI -- safe argparse help/version, no Safari automation
        run: |
          safari-mcp --version
          safari-mcp --help
          safari-mcp open --help
          safari-mcp js --help
      - name: Import the MCP server module -- safe, no stdio serve loop that would hang CI
        run: python -c "from safari_mcp import mcp_server; print('mcp_server imports OK')"

  build-artifact:
    name: build wheel + sdist
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build
      - name: Generate checksums
        run: |
          cd dist
          shasum -a 256 * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Smoke-test the built wheel installs and its CLI runs
        run: |
          python -m venv /tmp/smoke-venv
          source /tmp/smoke-venv/bin/activate
          pip install dist/*.whl
          safari-mcp --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
